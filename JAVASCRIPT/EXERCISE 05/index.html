<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            display: flex;
            flex-direction: row;
            gap: 15px;
            align-items: flex-start;
        }


        .box {
            width: 250px;
            height: 140px;
            position: relative;
            flex-shrink: 0;
            margin: 5px;
            padding: 12px;
        }

        img {
            object-fit: cover;
            width: 100%;
            height: 100%;
            border-radius: 8px;

            display: block;
        }

        .timestamp {
            position: absolute;
            right: 15px;
            bottom: 17px;

            color: white;
            background-color: rgba(0, 0, 0, 0.8);

            border-radius: 4px;
            padding: 3px 5px;

            font-size: 14px;
            font-weight: bold;
        }

        .text-content {
            max-width: 800px;
        }

        .content {
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 12px;

            line-height: 1.3;
        }

        .title {
            color: #aaaaaa;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <body>

    <div class="container"></div>

    <script src="script.js"></script>
</body>
<script src="script.js"></script>

</html>>
