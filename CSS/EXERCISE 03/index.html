<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03</title>
    <style>
        :root {
            --primary-color: #ae72e5;
            --text-color: white;
            --secondary-color: #bfbac0;
        }

        :root {
            --primary-color: rgb(46, 59, 163);
            --text-color: white;
            --secondary-color: rgb(233, 227, 227);
        }

        body {
            background-color: var(--secondary-color);
        }

        * {
            margin: 0px;
            padding: 0px;
        }

        nav {
            background-color: var(--primary-color);
            padding: 12px 0px;
        }

        ul li {
            list-style: none;
            display: inline;
            padding: 23px;
            color: var(--text-color);
        }

        ul li a {
            color: var(--text-color);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="">home</a></li>
                <li><a href="">about</a></li>
                <li><a href="">services</a></li>
                <li><a href="">contact us</a></li>
            </ul>
        </nav>
    </header>
</body>

</html>
