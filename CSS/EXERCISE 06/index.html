<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 5px 20px;
            border: 2px solid black;
            background-color: aqua;
            width: 100%;
            max-width: 1200px;
            height: 70px;
            margin: 0 auto;
            border-radius: 23px;
            box-sizing: border-box;
        }

        .left img {
            width: 145px;
            height: auto;
            object-fit: cover;
        }

        .right ul {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 23px;
        }

        .right ul li {
            list-style: none;
            font-size: 20px;
            font-weight: 300;
        }

        .data h1 {
            font-size: 45px;
            font-weight: 100;
            margin-bottom: 30px;
        }

        .data strong {
            font-weight: 700;
        }

        .data {
            text-align: center;
            padding-top: 90px;
        }

        .data p {
            font-weight: 100;
            font-size: 28px;
        }

        .language {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .languages {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f7f7f7;
            min-height: 150px;
            gap: 10px;
        }

        .languages h3 {
            font-weight: 400;
        }

        .languages button {
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            background-color: #12b8d4;
            color: white;
            cursor: pointer;
        }

        .languages button+button {
            background-color: rgb(116, 194, 116);
        }
    </style>
</head>
