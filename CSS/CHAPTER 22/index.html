<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        /* img{
            filter: blur(5px);
        } */
        .img1{
            filter: brightness(122%) contrast(200%);
        }
        .img2{
            /* filter: grayscale(100%); */
            filter: sepia(70%);
        }
        .img3{
            filter: opacity(0.6);
        }
        </style>
</head>
<body>
    <div class="container">
        <img src="https://th.bing.com/th/id/OIP.Ewth2PSH-Nvn6AdmHYg09AHaH1?w=164&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="" class="img1">
        <img src="https://th.bing.com/th/id/OIP.ejYgBJaJ6w4QXBOKGZTzYQHaEK?w=270&h=180&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="" class="img2">
        <img src="https://th.bing.com/th/id/OIP.IDHwKp70SpCLJRgSW-XF2AAAAA?w=149&h=187&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="" class="img3">
    </div>
</body>
</html>
