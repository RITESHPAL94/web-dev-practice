<html lang="en">

    .box:nth-child(even){
        background-color: black;
    }
    .boxes::before{
        content: "ritesh is a good guy";
        color: blue;
    }
    .boxes::after{
        content: "raj is also good";
        color: red;
    }
    ::selection{
    color: aqua;
    }
    .box::first-letter{
        color: peru;
    }
    input::placeholder{
        color: black;
    }
    </style>
</head>
<body>
    <div class="boxes">
        <div data-color="primary" class="box">hey i am a box</div>
        <div class="box">hey i am a box</div>
        <div class="box">hey i am a box</div>
        <input type="text" placeholder="tell me your name">
    </div>
</body>
