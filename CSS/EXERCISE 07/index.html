<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: blue;
            width: 90vw;
            height: 72vh;
            position: relative;
        }
        .box{
            background-color: red;
            height: 57px;
            width: 60px;
            border-radius: 60px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: Animatex 3s linear  infinite , Animatey 1s ease-out  infinite  alternate ;
        }
        @keyframes Animatex {
            from{
                left: 0;                
            }
            to{
                left: 100%;
            }
        }
        @keyframes Animatey {
            from{
                bottom: 0;
            }
            to{
                bottom: 100%;
            }
            
        }

           
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
