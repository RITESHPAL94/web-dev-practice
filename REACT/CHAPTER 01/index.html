<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 40px;
            height: 40px;
            border: 2px solid black;
        }
        .box2{
            width: 40px;
            height: 40px;
            border: 2px solid black;
        }
        .box3{
            width: 40px;
            height: 40px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    
        <div class="box1"> I am box 1</div>
        <div class="box2"> I am box 2</div>
        <div class="box3"> I am box 3</div>
    <script>
        setTimeout(() => {
          document.querySelector(".box1").innerHTML = "Hey"  
        }, 1000);
        setTimeout(() => {
          document.querySelector(".box2").innerHTML = "Hello"  
        }, 2000);
        setTimeout(() => {
          document.querySelector(".box3").innerHTML = "Hi"  
        }, 3000);
    </script>
</body>
</html>
